name: lychnion
description: "Offline AI helper for disaster preparedness and the outdoors (PoC)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_llama: 0.1.0
  # Needed directly for iOS/macOS SwiftPM linkage (pairs with llamadart 0.17.5).
  llamadart_llama_cpp_flutter: 0.17.3
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  sqlite3: ^3.9.1
  vector_map_tiles_pmtiles: ^1.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.1.2
  vector_map_tiles: ^8.0.0
  vector_tile_renderer: ^5.2.1
  crypto: ^3.0.8
  connectivity_plus: ^7.3.1
  qr_flutter: ^4.1.0
  app_links: ^7.2.2
  url_launcher: ^6.3.3
  cryptography: ^2.9.0
  # Signed records, shared with the data tools and nodes.
  lychnion_format:
    path: packages/lychnion_format
  # Downloads and catalog fetches, shared with the headless node.
  lychnion_fetch:
    path: packages/lychnion_fetch
  intl: any
  wakelock_plus: ^1.8.0
  # The app's version for Settings → About.
  package_info_plus: ^10.2.2
  bonsoir: ^7.1.5
  # Material moved out of the Flutter SDK (Flutter 3.47); it brings
  # cupertino_ui with it.
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Keep llamadart to llama.cpp only (no LiteRT-LM runtime).
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]

flutter:
  # App texts per language: lib/l10n/app_<lang>.arb (see l10n.yaml).
  generate: true
  uses-material-design: true
  assets:
    - assets/packages/
    - assets/maps/
    - assets/downloads/
    # The page a base computer serves to phones without the app.
    - assets/web/
    - assets/regions/
    # The app's own help (help/, built by tool/build_help.py).
    - assets/help/
    - assets/fonts/OFL-BIZUDPGothic.txt
    - assets/fonts/OFL-Lexend.txt
    - assets/fonts/OFL-ZenMaruGothic.txt
  # Brand fonts (SIL OFL 1.1), made by tool/build_fonts.py.
  fonts:
    - family: BIZUDPGothic
      fonts:
        - asset: assets/fonts/BIZUDPGothic-Regular.ttf
        - asset: assets/fonts/BIZUDPGothic-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
    # Only the letters of リクニオン.
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
