name: lychnion
description: "Offline AI helper for disaster preparedness and the outdoors (PoC)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_edge_ai: ^2.5.5
  flutter_edge_ai_llama: 0.0.5
  # Needed directly for iOS/macOS SwiftPM linkage (pairs with llamadart 0.15.1).
  llamadart_llama_cpp_flutter: 0.15.0
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  # 3.6+ needs a newer Flutter SDK (meta pin).
  sqlite3: ">=3.0.0 <3.6.0"
  vector_map_tiles_pmtiles: ^1.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.1.2
  vector_map_tiles: ^8.0.0
  vector_tile_renderer: ^5.2.1
  crypto: ^3.0.8
  connectivity_plus: ^7.3.1
  qr_flutter: ^4.1.0
  app_links: ^7.2.2
  url_launcher: ^6.3.3
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Keep llamadart to llama.cpp only (no LiteRT-LM runtime).
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]

flutter:
  uses-material-design: true
  assets:
    - assets/packages/
    - assets/maps/
    - assets/downloads/
