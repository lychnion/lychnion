name: lychnion_fetch
description: >-
  Lychnion's downloads: resumable, checked by SHA-256, with fallback
  addresses (mirrors), and size- and time-limited catalog fetches. Pure
  Dart, shared by the app and the headless node.
version: 1.0.0
publish_to: 'none'
repository: https://github.com/lychnion/lychnion/tree/main/packages/lychnion_fetch

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
