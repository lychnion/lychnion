repository: https://github.com/lychnion/lychnion/tree/main/packages/lychnion_format

environment:
  sdk: ^3.12.2

dependencies:
  cryptography: ^2.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
