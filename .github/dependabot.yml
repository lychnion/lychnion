# Dependency updates, weekly and grouped so they arrive as few PRs.
# New releases wait 14 days (cooldown) before Dependabot offers them;
# security updates are not delayed.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # The Flutter SDK pins intl (flutter_localizations); it moves with
      # the Flutter upgrade, not on its own (see #34, #11).
      - dependency-name: intl
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /packages/lychnion_format
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      format-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /packages/lychnion_fetch
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      fetch-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /packages/lychnion_node
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      node-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /packages/lychnion_node
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
