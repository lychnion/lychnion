# Analyzer settings for the app. See https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  # Packages have their own analysis options and CI job.
  exclude:
    - packages/**
  # JSON from packages and from other phones is untyped: make every cast
  # from dynamic explicit.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Bugs that strict typing alone misses.
    - avoid_dynamic_calls
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - strict_top_level_inference
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - literal_only_boolean_expressions
    - avoid_type_to_string
    - prefer_void_to_null
    - unnecessary_await_in_return
    - avoid_void_async
    - comment_references
    # TODO: turn on after lib/main.dart is split; its 2 findings follow then.
    # - discarded_futures
