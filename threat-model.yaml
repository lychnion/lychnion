adversaries:
- name: device-on-the-same-wi-fi
  scope: in
  capabilities:
  - Send any request to a base or a sharing phone
  - announce a fake base
  - read and change plain http
  - flood connections
  excluded_capabilities:
  - Holding a trusted base's private key
  - getting its own code compared in person as a base's
  - tapping dialogs for the user
  goals:
  - Fake facts or answers, read questions, crash or hang a base or phone
  provenance:
    kind: maintainer
    date: 2026-11
- name: host-outside-the-local-wi-fi
  scope: in
  capabilities:
  - Reach a port the base or a sharing phone opened on another interface
  excluded_capabilities:
  - Reaching a port that is bound only to the Wi-Fi
  goals:
  - Use the base or read installed items
  provenance:
    kind: maintainer
    date: 2026-11
- name: sender-of-links-web-page-message-other-a
  scope: in
  capabilities:
  - Open lychnion:// links with any parameters
  excluded_capabilities:
  - Confirming the dialog for the user
  - being scanned in person as a base's QR code
  goals:
  - Get a key trusted, follow a hostile catalog, point the phone at a hostile base
  provenance:
    kind: maintainer
    date: 2026-11
- name: catalog-mirror-or-file-host-that-is-not
  scope: in
  capabilities:
  - Serve any bytes, old signed records, redirects
  - delay or withhold
  - drop or replay key statements
  excluded_capabilities:
  - Signing records
  - forging a key statement
  - making a wrong file install
  goals:
  - Install a tampered file, hide updates, learn what users download
  provenance:
    kind: maintainer
    date: 2026-11
- name: usb-stick-author
  scope: in
  capabilities:
  - Any catalog, files and links on the stick
  excluded_capabilities:
  - Signing records
  goals:
  - Install a tampered or squatting item
  provenance:
    kind: documented
    source: docs/distribution.md "Sync between nodes"
- name: publisher-the-user-added
  scope: in
  capabilities:
  - Sign any record, content and key statement for its name, including text that steers the model
  excluded_capabilities:
  - Signing records or statements for lychnion or another name
  - naming a successor key it does not hold
  - shipping models
  - supplying the official safety line
  goals:
  - Replace Lychnion's items or files, make its lines look official
  provenance:
    kind: maintainer
    date: 2026-11
- name: holder-of-an-old-or-stolen-publisher-key
  scope: in
  capabilities:
  - Sign records and statements for that name
  - revoke the key
  - name a second successor
  excluded_capabilities:
  - Keys it does not hold
  - the user's dialogs
  goals:
  - Impersonate the publisher, or make phones drop it
  provenance:
    kind: documented
    source: docs/distribution.md "Backing up and replacing the key"
- name: operator-of-a-trusted-base-code-compared-in-person
  scope: out
  capabilities:
  - Sign facts and answers that phones trust
  excluded_capabilities: []
  goals: []
  provenance:
    kind: maintainer
    date: 2026-11
- name: lychnion-key-holder-maintainers-build-ma
  scope: out
  capabilities:
  - Sign anything as Lychnion, ship builds
  excluded_capabilities: []
  goals: []
  provenance:
    kind: maintainer
    date: 2026-11
- name: someone-controlling-the-device
  scope: out
  capabilities:
  - Read and change app files and memory
  excluded_capabilities: []
  goals: []
  provenance:
    kind: documented
    source: SECURITY.md "In scope", the "Out of scope:" paragraph
- name: the-user-asking
  scope: out
  capabilities:
  - Type any question
  excluded_capabilities: []
  goals: []
  provenance:
    kind: maintainer
    date: 2026-11
