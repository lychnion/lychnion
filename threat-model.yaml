- id: follow-official-warnings
  component: answers
  statement: Follow official warnings first.
  enforces:
  - ai-wording-correctness
  provenance:
    kind: documented
    source: help/en/02-asking.md "Are there things it cannot answer?"
- id: base-on-controlled-wifi
  component: base-server
  statement: Run the base on a Wi-Fi you control; treat it as readable by everyone on it.
  enforces:
  - lan-confidentiality
  provenance:
    kind: documented
    source: docs/base.md "Network"
- id: base-offline-while-serving
  component: base-server
  statement: Keep the base offline while serving, or accept cross-site requests.
  enforces:
  - keep-bases-offline-1-12-cross-site-requests
  provenance: &id017
    kind: maintainer
    date: 2026-11
- id: publisher-key-offline-copy
  component: publishing
  statement: Save a passphrase backup of the key and keep it offline; restore only the newest backup;
    keep backups of replaced keys as safe as the newest one.
  enforces:
  - publisher-key-local
  - keep-the-backup-offline-and-the-passphrase-strong
  provenance:
    kind: documented
    source: docs/distribution.md "Backing up and replacing the key"
- id: node-operator-duties
  component: node
  statement: Check each --publisher key out of band, use a reverse proxy on the internet, pull a USB stick
    instead of serving it.
  enforces:
  - the-operator-checks-the-key
  - reverse-proxy-on-the-internet
  provenance: *id017
- id: release-without-dev-flags
  component: answers
  statement: Build releases without --dart-define dev flags.
  enforces:
  - signed-install-only
  provenance: *id017
- id: source-for-recipients
  component: base-server
  statement: Give every recipient the source, also for a base.
  enforces: []
  provenance:
    kind: documented
    source: LICENSE-APPSTORE-EXCEPTION.md "Additional permission under section 7 of the GNU AGPL version
      3"
known_misuses:
- id: base-on-guest-wifi
  components:
  - base-server
  pattern: running a base on guest or office Wi-Fi
  safer_alternative: use a hotspot or router the shelter controls
  provenance:
    kind: documented
    source: docs/base.md "Network"
- id: unknown-publisher-link
  components:
  - downloads
  pattern: adding a publisher from an unknown link
  safer_alternative: add only publishers you know
  provenance:
    kind: documented
    source: help/en/07-publishers.md "How do I add a publisher, such as my city?"
- id: tick-without-comparing
  components:
  - downloads
  pattern: ticking "I compared the code" without comparing
  safer_alternative: compare the code with the body's official website, or do not add the publisher
  provenance:
    kind: documented
    source: help/en/07-publishers.md "Why does the app ask me to compare a code?"
- id: vouch-as-content-check
  components:
  - downloads
  pattern: reading "Checked by Lychnion" as "its guides are right"
  safer_alternative: read a vouch as whose key it is, not as a check of the content
  provenance:
    kind: documented
    source: docs/vouching.md "What a vouch does, and what it never does"
- id: signed-as-true
  components:
  - facts
  - records
  pattern: treating signed as official and true
  safer_alternative: read a signature as who vouches, not as correctness
  provenance:
    kind: documented
    source: docs/facts-results.md "Signed facts (2026-11-05)"
- id: ship-dev-flags
  components:
  - answers
  - downloads
  pattern: shipping a build with dev flags such as DEV_MENU=true
  safer_alternative: build releases without --dart-define
  provenance: *id017
- id: serve-usb-stick
  components:
  - node
  pattern: serving a USB stick with lychnion_node serve
  safer_alternative: pull the stick into the node folder
  provenance: *id017
known_non_findings:
- id: unsigned-mirrors
  components:
  - downloads
  - node
  symptom: integrity-bypass
  tool_pattern: Catalog urls and mirrors are unsigned, so an attacker can point downloads at their server
  conditions: The app or node contacts the host, and the file is installed only if its size and SHA-256
    match the signed record
  discharged_by:
  - signed-install-only
  provenance:
    kind: documented
    source: 'docs/distribution.md "Storage: files by hash, any server"'
- id: plain-http-file-tamper
  components:
  - downloads
  - base-client
  - node
  symptom: integrity-bypass
  tool_pattern: Downloads from a base, phone or node use plain http, so files can be swapped
  conditions: Tampered bytes fail the hash and are not installed
  discharged_by:
  - signed-install-only
  provenance:
    kind: documented
    source: docs/data-packages.md "Signing and trust"
- id: unsigned-key-list
  components:
  - downloads
  - records
  - node
  symptom: integrity-bypass
  tool_pattern: The catalog keys list is unsigned, so a host can inject key statements
  conditions: The injected statements are not signed by a key the device trusts for that publisher, and
    are not kept
  discharged_by:
  - key-statement-verification
  provenance:
    kind: documented
    source: docs/distribution.md "Backing up and replacing the key"
- id: ai-wrong-advice
  components:
  - answers
  symptom: wrong-output
  tool_pattern: The model gave wrong or unsafe advice
  conditions: The answer shows its sources and the safety line where one matches; no forged citation or
    missing warning
  discharged_by:
  - ai-wording-correctness
  provenance:
    kind: maintainer
    date: 2026-11
dispositions:
- VALID
- VALID-HARDENING
- 'OUT-OF-MODEL: trusted-input'
- 'OUT-OF-MODEL: adversary-not-in-scope'
- 'OUT-OF-MODEL: unsupported-component'
- 'OUT-OF-MODEL: non-default-build'
- 'OUT-OF-MODEL: dependency-contract'
- 'BY-DESIGN: property-disclaimed'
- KNOWN-NON-FINDING
- MODEL-GAP
disposition_precedence:
