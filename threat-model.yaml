  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: native-parser-safety
  components:
  - answers
  - downloads
  conditions: Safety of llama.cpp, sqlite3 and map renderers on crafted files. Files from Lychnion or
