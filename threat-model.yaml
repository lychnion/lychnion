  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: os-backup
  components:
  - device-data
  conditions: Exclusion of app data from OS backups. The user's own backup choice
  tier: correctness-only
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: local-resource-bounds
  components:
  - answers
  conditions: Limits on a question typed on the device. Input against the user's own device
  tier: correctness-only
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: base-key-id-collision
  components:
  - facts
  - base-client
  conditions: Protection against a 48-bit key-id collision that replaces a trusted base key. Denial of
