  tier: correctness-only
  false_friend: false
  provenance:
    kind: documented
    source: docs/distribution.md "Following catalogs"
- id: multi-file-update-atomicity
  components:
  - downloads
  conditions: All-or-nothing network updates of items with several files. Each file still matches a signed
