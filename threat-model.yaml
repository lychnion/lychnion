properties_claimed:
- id: signed-install-only
  kind: integrity
  components:
  - downloads
  - records
  - node
  - base-client
  tier: security-critical
  conditions: a file from any source is installed or served onward only when its record verifies against
    a trusted key for that publisher name and the file's size and SHA-256 match. A trusted key is a built-in
    or added key, or a successor named by a valid key statement, and not revoked.
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: documented
    source: docs/data-packages.md "Signing and trust"
- id: publisher-namespace
  kind: integrity
  components:
  - downloads
  - records
  - node
  tier: security-critical
  x-known-violations:
  - the headless node reserves nothing; it accepts an added publisher's record for a Lychnion id it has
    not pulled from Lychnion yet, and Lychnion takes the id back only when its source is pulled (`packages/lychnion_node/lib/src/pull.dart:189`).
  conditions: 'an added publisher never replaces Lychnion''s items or files, or another publisher''s ids,
    also not by upper or lower case or by a name Windows changes (a trailing dot) or opens as a device (`NUL`), which a record may not have (`packages/lychnion_format/lib/src/record.dart:140`), and its key statements count only for its own name. In the app, Lychnion''s
    ids and file names (the bundled packages, the bundled catalog and Lychnion''s items in every checked catalog
    of Lychnion''s) are reserved, also when not installed: an added publisher''s record for one is refused
    from a USB stick, a followed catalog or a base, a copy installed before is not used, and Lychnion''s own
    replaces it (`lib/download/download_store.dart:199`).'
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: documented
    source: docs/distribution.md "Publishers and keys"
- id: no-downgrade-installed
  kind: integrity
  components:
  - downloads
  - records
  - publishing
  - node
  tier: security-critical
  conditions: an installed item is never replaced with an older version.
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: documented
    source: "docs/distribution.md\n  \"Principles\""
- id: key-consent
  kind: authentication
  components:
  - downloads
  - base-client
  tier: security-critical
  conditions: 'a publisher key or base key becomes trusted only after the user says yes, and a base key
    gets fact trust only after the user compared its code with the base''s screen in person (`lib/base/base_key_code.dart`);
    a link alone, from the QR code or a web page, only pins the key. Two exceptions come from the publisher''s own statements:
    a successor named by a trusted key''s replacement is trusted without a dialog, and a revoked publisher''s
    new link replaces its entry after a dialog.'
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: maintainer
    date: 2026-11
- id: grounded-answer-presentation
  kind: x-answer-grounding
  components:
  - answers
  tier: security-critical
  conditions: 'an answer is built only from installed guides and shows its sources; an answer whose citations
    do not check out carries a warning; the app never shows bare-model text as an answer: the phone answers
    by itself only when the model and the guides are loaded, so a failure after the model is up (the search
    model, indexing, a package) turns the question bar off unless a base answers, and a question that still
    reaches it gets a "cannot answer without the guides" message (`lib/ask/answer_rules.dart:12`).'
  violation_symptoms:
  - x-ungrounded-answer
  provenance:
    kind: documented
    source: SECURITY.md "In scope"
- id: safety-line-lychnion-only
  kind: integrity
  components:
  - answers
  tier: security-critical
  conditions: 'when a hazard question matches, the fixed safety line from a Lychnion-signed package is
    shown word for word above the AI text; no other publisher supplies it: a package whose record is not
    signed by a built-in publisher is loaded without its alerts (`lib/ask/model_loading.dart`, `KnowledgePackage.withoutAlerts`),
    its copy of a bundled Lychnion package is not loaded (`DownloadStore.bundledPackageSource`), and an empty trigger word matches nothing.'
  violation_symptoms:
  - x-missing-or-forged-safety-line
  provenance:
    kind: maintainer
    date: 2026-11
- id: models-lychnion-only
  kind: integrity
  components:
  - downloads
  - answers
  tier: security-critical
  conditions: 'only models signed by Lychnion are installed and loaded: a `model` record from any other publisher
    is refused in catalogs (also followed ones and bases), on USB sticks, when installing and by nodes when they pull, and one
    installed by an older build is never loaded or picked (`packages/lychnion_format/lib/src/publishers.dart:21`).'
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: maintainer
    date: 2026-11
- id: base-answer-signature
  kind: authentication
  components:
  - base-client
  - base-server
  tier: security-critical
  conditions: with a pinned key, the phone accepts a base answer only when its Ed25519 signature covers
    the phone's nonce, a hash of the request and the exact body; once that base has signed, unsigned answers
    are refused. A QR code with `s=1` says the base signs, so unsigned answers are refused from the first
    one. A late answer from a previous base is ignored. An answer from a base without a pinned key, or
    an unsigned one, carries a note saying so.
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: documented
    source: "docs/shelter-results.md\n  \"How it works\""
- id: fact-verification
  kind: authentication
  components:
  - facts
  tier: security-critical
  conditions: an official or sensor fact shows as verified only with a signature from a trusted key; others
    count as resident reports and are labelled. Signed fields never contain control characters, so a signature
    never fits a different split of the fields *(maintainer, 2026-11)*.
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: documented
    source: "docs/facts-results.md\n  \"Signed facts (2026-11-05"
- id: unverified-facts-not-acted-on
  kind: integrity
  components:
  - facts
  tier: security-critical
  conditions: 'only verified facts change the suggested evacuation site or walking route: a shelter is avoided,
    a road routed around and a warning''s hazard used only when the fact is confirmed (`lib/map/map_state.dart:64`,
    `lib/map/map_state.dart:183`, `lib/map/map_state.dart:56`); unconfirmed ones are shown with their label.'
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: maintainer
    date: 2026-11
- id: fact-time-bounds
  kind: correctness
  components:
  - facts
  tier: security-critical
  conditions: 'a fact dated in the future, or with a lifetime far beyond normal, does not win its topic: a fact
    dated more than 30 minutes ahead, living longer than 3 days, or expiring more than that from now is refused
    on arrival and never current (`lib/facts/fact_store.dart:352`); among facts of the same trust, one dated after
    now loses to every one that is not (`lib/facts/fact_store.dart:384`) until its date comes, so a date in the
    30-minute window can delay an override by at most that long, as a report sent at that time could.'
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: maintainer
    date: 2026-11
- id: base-request-limits
  kind: resource-bound
  components:
  - base-server
  tier: security-critical
  conditions: 'every request has limits: 100 connections in all, 24 from one address, body 8 KiB within 10 s, question 500
    characters, 8 live questions, one per address, 30 s idle, 30 s send stall, answers stop when the phone
    leaves. No single request makes the base hang, crash or allocate without bound. Threshold: a hang
    or unbounded allocation is a bug; slow under a flood is not (§1.12 `lan-availability`).'
  violation_symptoms:
  - hang
  - unbounded-allocation
  provenance:
    kind: documented
    source: "docs/shelter-results.md \"How it works\"; lib/base/base_server.dart\n  `BaseServer` doc comment"
- id: client-response-limits
  kind: resource-bound
  components:
  - base-client
  - downloads
  - records
  - facts
  - node
  tier: security-critical
  conditions: 'what a phone or node accepts is capped: 16 KiB for a base''s `/info`, 1 MiB for facts and
    answers, 500 facts per pull and 5,000 kept, 2 MB per catalog read within 45 s, 500 key statements
    per list and 1000 kept (besides revocations and theft proofs). A hostile response does not crash or hang the reader, and deeply nested JSON
    from any of these sources is rejected *(maintainer, 2026-11)*.'
  violation_symptoms:
  - unbounded-allocation
  - crash
  - hang
  provenance:
    kind: documented
    source: CHANGELOG.md "Security"
- id: lan-only-exposure
  kind: confidentiality
  components:
  - base-server
  tier: security-critical
  conditions: 'the base and Share nearby are reachable only from the local Wi-Fi or hotspot: they listen
    only on the device''s private IPv4 addresses on interfaces with a known Wi-Fi, hotspot, tethering or wired name, never on mobile data,
    a known VPN or virtual interface, carrier-grade NAT (100.64/10) or a public address (and on loopback, which only the device itself reaches), and follow those addresses as the network changes (`lib/base/lan_sockets.dart`).'
  x-known-violations:
  - a VPN or virtual adapter whose name is not known, but starts like a wired one, is listened on too.
  - a computer on two private networks (the shelter Wi-Fi and an office LAN) listens on both; the screen
    lists both addresses.
  violation_symptoms:
  - info-leak
  provenance:
    kind: maintainer
    date: 2026-11
- id: blob-serving-by-hash
  kind: confidentiality
  components:
  - base-server
  - node
  tier: security-critical
  conditions: servers answer only fixed routes and serve files only by SHA-256 from verified records or
    the node folder; no request part becomes a path.
  violation_symptoms:
  - info-leak
  provenance:
    kind: documented
    source: CHANGELOG.md "Security"
- id: browser-page-text-only
  kind: output-sanitization
  components:
  - base-server
  tier: security-critical
  conditions: the browser page shows all data as text, never as HTML.
  violation_symptoms:
  - x-script-injection
  provenance:
    kind: documented
    source: "docs/shelter-results.md \"Sharing switch and browser\n  page (2026-11-18"
- id: device-egress
  kind: confidentiality
  components:
  - device-data
  - base-client
  tier: security-critical
  x-known-violations:
  - a `.local` name goes through the system resolver, so a DNS server on the network could point one at an
    internet host.
  conditions: 'questions leave the device only to a base the user connected to on the local network; position
    never leaves; release builds do not log questions, answers or position. A base address must be on the
    local network: a private IPv4 address, a link-local or private IPv6 address, a `.local` name, or loopback
    in debug builds and on desktops (`lib/base/base_link.dart:124`); a base saved by an older build is checked
    again when the settings load and before connecting. Release builds leave the question, answer, search query,
    matched sources and region out of the log, and errors keep only their type (`lib/app/dev_flags.dart:99`).'
  violation_symptoms:
  - info-leak
  provenance:
    kind: maintainer
    date: 2026-11
- id: lan-device-same-origin
  kind: confidentiality
  components:
  - downloads
  tier: correctness-only
  conditions: 'from a base or a nearby phone, the app downloads only files on that device, never from other
    addresses its catalog names or redirects to: the redirect guard counts as local every host that discovery
    and base addresses accept, from one shared definition of the private ranges (`packages/lychnion_fetch/lib/src/downloader.dart:416`),
    plus plain names without a dot (`packages/lychnion_fetch/lib/src/downloader.dart:430`).'
  violation_symptoms:
  - info-leak
  provenance:
    kind: documented
    source: CHANGELOG.md "Security"
- id: atomic-file-install
  kind: integrity
  components:
  - downloads
  - publishing
  - node
  tier: security-critical
  conditions: a file gets its final name only after its size and hash match; on failure the last good
    file stays.
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: documented
    source: "packages/lychnion_node/README.md\n  \"Operating\""
- id: publisher-key-local
  kind: confidentiality
  components:
  - publishing
  tier: security-critical
  conditions: the plain desktop publisher key stays in the app folder and is never served or shared. The
    only copy that leaves it is the passphrase-encrypted backup the operator saves.
  violation_symptoms:
  - info-leak
  provenance:
    kind: documented
    source: "docs/distribution.md \"Publishers and\n  keys\""
- id: publisher-removal-deletes
  kind: correctness
  components:
  - downloads
  tier: correctness-only
  conditions: removing a publisher deletes and unloads its items.
  violation_symptoms:
  - wrong-output
  provenance:
    kind: documented
    source: help/en/07-publishers.md "How do I add a publisher, such as my city?"
- id: node-private-address-filter
  kind: x-request-forgery-filter
  components:
  - node
  tier: correctness-only
  conditions: 'a node skips file addresses on private or local networks, also after a redirect, unless
    the catalog itself is on such a network; an internet catalog''s own redirects are checked the same way.
    Private or local means any address that is not plain public unicast, including `::`, multicast, special
    ranges and IPv4 carried in IPv6, Teredo and site-local (`packages/lychnion_node/lib/src/pull.dart:369`). DNS rebinding is not caught.'
  violation_symptoms:
  - x-request-forgery
  provenance:
    kind: documented
    source: packages/lychnion_node/README.md "Operating"
- id: key-statement-verification
  kind: authentication
  components:
  - records
  - downloads
  - node
  tier: security-critical
  conditions: a replacement counts only when the old key signed it and the new key countersigned it; a
    revocation only when the revoked key signed it; and only when the old key is trusted for that publisher
    at that moment. A revoked key, a key with two successors, and any key reached only through them is
    not trusted. This holds for the `lychnion` key too.
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: documented
    source: docs/distribution.md "Backing up and replacing the key"
- id: revocation-unloads
  kind: integrity
  components:
  - downloads
  tier: security-critical
  conditions: once a revocation is learned, items whose record the revoked key signed are no longer used.
    Their files stay on disk, and their version still blocks a downgrade.
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: documented
    source: docs/distribution.md "Backing up and replacing the key"
- id: key-backup-confidentiality
  kind: confidentiality
  components:
  - publishing
  tier: security-critical
  conditions: the private key in a backup is readable only with the passphrase (Argon2id, then AES-256-GCM;
    name and public key bound). Restore never replaces a key, never restores a key this computer knows
    as revoked or replaced, and writes nothing on a wrong passphrase or a damaged file.
  violation_symptoms:
  - info-leak
  provenance:
    kind: maintainer
    date: 2026-11
- id: answers-never-mix
  kind: correctness
  components:
  - answers
  - base-server
  tier: correctness-only
  conditions: while a computer serves phones, answers to phones and to its own Ask page never mix, and
    a phone that leaves stops only its own answer.
  violation_symptoms:
  - wrong-output
  provenance:
    kind: maintainer
    date: 2026-11
properties_disclaimed:
- id: ai-wording-correctness
  components:
  - answers
  conditions: Correct or complete wording of AI answers. Source and safety line are shown; stated limit,
    not silence
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: citation-means-support
  components:
  - answers
  conditions: Proof that a cited passage supports the sentence. [n] means only "this passage was given
    to the model"
  tier: security-critical
  false_friend: true
  provenance:
    kind: maintainer
    date: 2026-11
- id: signed-means-true
  components:
  - records
  - facts
  - base-client
  - answers
  conditions: Truth of signed content, or the signer's authority over a shelter. Records, facts and answers;
    a signature proves origin
  tier: security-critical
  false_friend: true
  provenance:
    kind: documented
    source: docs/facts-results.md "Signed facts (2026-11-05
- id: publisher-content
  components:
  - answers
  - downloads
  conditions: Vetting of an added publisher's guides, including text that steers the model, synonyms and
    vectors. Only under that publisher's own name; not its safety lines or models
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: freshness
  components:
  - downloads
  - node
  conditions: Protection against being kept on old data. No expiry on records or key statements; catalogs
    unsigned; a carrier can withhold a revocation; older apps ignore statements; also after delete, publisher
    removal, reinstall or on a fresh node
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: key-revocation
  components:
  - facts
  - base-client
  conditions: Rotation, revocation or removal of base (fact) keys. Publisher keys, Lychnion's included,
    have signed replacement and revocation (key-statement-verification)
  tier: security-critical
  false_friend: false
  provenance:
    kind: documented
    source: docs/facts-results.md "Signed facts (2026-11-05
- id: old-key-denial
  components:
  - records
  - downloads
  - node
  conditions: Protection against the holder of an old or stolen publisher key who revokes it or names
    a second successor. Phones that added that key drop it and its successors until the user adds the
    new link
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: backup-passphrase-and-storage
  components:
  - publishing
  conditions: Resistance of a key backup to offline guessing of a weak passphrase; protection of the backup
    file where the operator keeps it. Passphrase of at least 12 characters; the operator chooses where
    to save
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: lan-confidentiality
  components:
  - base-server
  - base-client
  conditions: Confidentiality on the Wi-Fi of questions, answers, facts and the list of installed packages.
    Plain http on the local network; packages are public data
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: browser-page-integrity
  components:
  - base-server
  conditions: Integrity of the browser page for phones without the app. Plain http, unsigned. The page shows no current facts (shelter status, warnings) and says that it is not checked; the base's screen says so next to the page's QR code, where the Wi-Fi cannot change it (lychnion/lychnion#116). Encryption waits for #109
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: first-signature-strip
  components:
  - base-client
  conditions: Protection against stripping signatures before a pinned base has signed once. Only for a
    QR code without s=1 (older codes), until the first signed answer; the "unsigned" note is the defence
  tier: security-critical
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: cross-site-requests
  components:
  - base-server
  conditions: Defence against cross-site requests and DNS rebinding from a web page. While bases run without
