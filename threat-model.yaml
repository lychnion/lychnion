  tier: correctness-only
  false_friend: false
  provenance:
    kind: maintainer
    date: 2026-11
- id: download-time-and-disk
  components:
  - downloads
  - node
  conditions: A time limit per download, or a disk quota. Size and hash still decide; a bad mirror costs
