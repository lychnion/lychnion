# App texts per language. A new language = a new lib/l10n/app_<lang>.arb.
# Data (packages, safety lines, notices, catalog) carries its own languages.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
# The generator (Flutter 3.50) still uses the localizations that moved to
# material_ui and cupertino_ui; until it changes, its output says so once.
header: "// ignore_for_file: deprecated_member_use"
